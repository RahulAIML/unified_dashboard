# Render blueprint for the AI dashboard-builder service.
# Deploy: point Render at this repo, rootDir = ai-service. Then set AI_SERVICE_URL
# on the Next.js service to this service's URL so /api/ai/* proxies to it.
services:
  - type: web
    name: rolplay-ai-dashboard-builder
    runtime: python
    rootDir: ai-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Dashboard Builder work (schema/company discovery, dashboard planning,
      # insights) benefits from deeper reasoning more than low latency, unlike
      # Robin AI (lib/ai.ts's ROBIN_AI_MODEL, a separate, fast-tier setting on
      # the Next.js service) -- Gemini's thinkingLevel lets the SAME model
      # reason harder without switching to a slower/costlier model tier.
      # gemini-3.7-flash's thinkingLevel does NOT support "minimal" (the API
      # errors on it) -- keep this at low/medium/high only.
      - key: LLM_MODEL
        value: gemini-3.7-flash
      - key: LLM_THINKING_LEVEL
        value: high
      - key: AUTH_DATABASE_URL
        sync: false
      # MUST be the IDENTICAL value as SECRET_ENCRYPTION_KEY on the Next.js
      # service — this decrypts the SAME tenant_credentials rows (LMS
      # credentials, etc.) that service already writes. A mismatched value
      # means every tenant's credentials fail to decrypt here even though
      # the Next.js app reads them fine.
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: PHARMA_BRIDGE_BASE_URL
        value: https://serv.aux-rolplay.com/unified
      - key: PHARMA_HOST_ROOT
        value: https://serv.aux-rolplay.com
      - key: ROLPLAY_APP_SQL_URL
        value: https://rolplay.app/ajax/remote-access.php
      - key: BRIDGE_URL
        sync: false
      - key: BRIDGE_SECRET
        sync: false
      - key: SECOND_BRAIN_API_URL
        sync: false
      - key: SECOND_BRAIN_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://rolplaypro-dashboard.onrender.com
      # Must match AI_SERVICE_SHARED_SECRET on the Next.js service — this
      # service has no auth of its own otherwise (CORS only stops browser
      # calls, not a direct request to this service's own public URL).
      - key: INTERNAL_SHARED_SECRET
        sync: false
      # Optional (see app/cache.py) — unset means /ai/render/{slug} falls back
      # to an in-process cache, correct for one instance but not shared across
      # a scaled-out deploy. Set to a Render Redis/Key Value instance's
      # connection string to share that cache across instances.
      - key: REDIS_URL
        sync: false
